name: berkah_pos
description: Berkah POS — kasir toko retail (Android + iOS).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  flutter_dotenv: ^5.2.1
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.19.0
  image_picker: ^1.0.8
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  mobile_scanner: ^5.2.0
  qr_flutter: ^4.1.0
  share_plus: ^10.1.2
  path_provider: ^2.1.4
  pdf: ^3.11.0
  printing: ^5.13.0
  sqflite: ^2.3.3+1
  shared_preferences: ^2.5.5
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
